# Fabrique les installateurs de RustMotion (Windows x64, macOS Apple Silicon, Linux x64) et la CLI,
# puis les attache à une release GitHub en brouillon. macOS Intel n'est volontairement pas produit.
#
# Déclenchement :
#   - en poussant un tag « vX.Y.Z » (il doit correspondre à la version de src-tauri/tauri.conf.json) ;
#   - à la main, depuis l'onglet Actions (« Run workflow ») : le tag vient alors de tauri.conf.json.
#
# La release reste un brouillon : relisez-la sur GitHub, puis publiez-la.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Préparer la release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version v$version de src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Créer (ou réutiliser) la release brouillon
        id: release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const releases = await github.paginate(github.rest.repos.listReleases, repo);
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              if (!existing.draft) throw new Error(`La release ${tag} est déjà publiée : changez la version.`);
              core.info(`Brouillon existant réutilisé : ${existing.html_url}`);
              return existing.id;
            }
            const body = [
              `## RustMotion ${tag}`,
              '',
              'Convertisseur d\'animations HTML / CSS / JS en vidéo (MP4, MOV, WebM).',
              'HTML / CSS / JS animation to video converter (MP4, MOV, WebM).',
              '',
              '### Téléchargements / Downloads',
              '',
              '| Système / OS | Application | CLI |',
              '|---|---|---|',
              '| Windows x64 | `.msi` ou / or `.exe` (setup) | `rustmotion-cli-*-windows-x64.zip` |',
              '| macOS Apple Silicon | `*_aarch64.dmg` | `rustmotion-cli-*-macos-arm64.tar.gz` |',
              '| Linux x64 | `.deb`, `.rpm`, `.AppImage` | `rustmotion-cli-*-linux-x64.tar.gz` |',
              '',
              '### Prérequis / Requirements',
              '',
              '- Google Chrome, Microsoft Edge, Chromium ou / or Brave',
              '- ffmpeg (PATH, ou chemin à indiquer dans l\'application / or set its path in the app)',
              '',
              'Les binaires ne sont pas signés : Windows SmartScreen et macOS Gatekeeper afficheront un avertissement.',
              'Binaries are not signed: Windows SmartScreen and macOS Gatekeeper will show a warning.',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `RustMotion ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            core.info(`Brouillon créé : ${data.html_url}`);
            return data.id;

  build:
    name: ${{ matrix.label }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
          - label: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Trunk (build du frontend Leptos)
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Application (installateurs Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ env.RELEASE_ID }}
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --target ${{ matrix.target }}

      - name: CLI
        run: cargo build --release --locked -p rustmotion-engine --target ${{ matrix.target }}

      - name: Archive de la CLI
        id: cli
        shell: bash
        run: |
          name="rustmotion-cli-${VERSION}-${{ matrix.label }}"
          bin="target/${{ matrix.target }}/release/rustmotion-cli"
          mkdir -p "dist-cli/$name"
          cp README.md README.en.md LICENSE "dist-cli/$name/"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "$bin.exe" "dist-cli/$name/"
            (cd dist-cli && 7z a -tzip "$name.zip" "$name" > /dev/null)
            echo "file=dist-cli/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "$bin" "dist-cli/$name/"
            tar -czf "dist-cli/$name.tar.gz" -C dist-cli "$name"
            echo "file=dist-cli/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Joindre la CLI à la release
        uses: actions/github-script@v7
        env:
          FILE: ${{ steps.cli.outputs.file }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const release_id = Number(process.env.RELEASE_ID);
            const file = process.env.FILE;
            const name = path.basename(file);
            // Relance du workflow : remplace l'archive déjà jointe.
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { ...repo, release_id });
            for (const a of assets.filter((a) => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: a.id });
            }
            const data = fs.readFileSync(file);
            await github.rest.repos.uploadReleaseAsset({
              ...repo,
              release_id,
              name,
              data,
              headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
            });
            core.info(`Archive jointe : ${name}`);
