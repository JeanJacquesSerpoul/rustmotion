[package]
name = "rustmotion-ui"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Interface Leptos de RustMotion"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Storage", "Document", "Element", "HtmlMediaElement", "HtmlAudioElement"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
console_error_panic_hook = "0.1"
rustmotion-types = { path = "crates/rustmotion-types" }

[workspace]
members = ["src-tauri", "crates/rustmotion-types", "crates/rustmotion-engine"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
