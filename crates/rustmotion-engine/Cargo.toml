[package]
name = "rustmotion-engine"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Moteur de rendu HTML -> vidéo (Chrome headless + ffmpeg)"

[lib]
name = "rustmotion_engine"

[[bin]]
name = "rustmotion-cli"
path = "src/bin/rustmotion-cli.rs"

[dependencies]
rustmotion-types = { path = "../rustmotion-types" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tiny_http = "0.12"
percent-encoding = "2"
sys-locale = "0.3"
