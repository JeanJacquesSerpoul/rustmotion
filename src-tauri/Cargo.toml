[package]
name = "rustmotion"
version = "0.1.0"
description = "RustMotion — convertisseur d'animations HTML en vidéo"
edition = "2021"
license = "MIT"

[lib]
name = "rustmotion_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustmotion-engine = { path = "../crates/rustmotion-engine" }
rustmotion-types = { path = "../crates/rustmotion-types" }
